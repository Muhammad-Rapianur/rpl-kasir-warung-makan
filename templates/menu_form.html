{% extends "base.html" %}

{% block judul %}{{ judul }} — KasirWarung{% endblock %}

{% block isi %}
<div class="form-card">
  <h1 style="margin-top: 0; font-size: 22px; border-bottom: 1px solid var(--border); padding-bottom: 12px;">{{ judul }}</h1>

  {% if galat %}
    <div class="pesan-flash pesan-galat" style="margin-bottom: 16px;">
      <ul style="margin: 0; padding-left: 20px;">
        {% for g in galat %}
          <li>{{ g }}</li>
        {% endfor %}
      </ul>
    </div>
  {% endif %}

  <form method="post">
    <div class="form-group">
      <label for="nama">Nama Menu Makanan / Minuman <span style="color: red;">*</span></label>
      <input type="text" id="nama" name="nama" class="form-control" placeholder="Contoh: Ayam Bakar Madu" value="{{ menu.get('nama', '') }}" required>
    </div>

    <div class="form-group">
      <label for="kategori_id">Kategori Menu <span style="color: red;">*</span></label>
      <select id="kategori_id" name="kategori_id" class="form-control" required>
        <option value="">-- Pilih Kategori --</option>
        {% for k in kategori %}
          <option value="{{ k['id'] }}" {% if menu.get('kategori_id')|string == k['id']|string %}selected{% endif %}>
            {{ k['nama'] }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label for="harga">Harga Jual Satuan (Rp) <span style="color: red;">*</span></label>
      <input type="number" id="harga" name="harga" class="form-control" placeholder="Contoh: 18000" min="1" value="{{ menu.get('harga', '') }}" required>
      <small style="color: #6c757d;">Masukkan hanya angka tanpa titik atau koma.</small>
    </div>

    {% if apakah_ubah %}
    <div class="form-group">
      <label for="status">Status Ketersediaan Menu</label>
      <select id="status" name="status" class="form-control">
        <option value="tersedia" {% if menu.get('status') == 'tersedia' %}selected{% endif %}>Tersedia (Dapat dipesan di kasir)</option>
        <option value="habis" {% if menu.get('status') == 'habis' %}selected{% endif %}>Habis (Dinonaktifkan di kasir)</option>
      </select>
    </div>
    {% endif %}

    <div style="margin-top: 24px; display: flex; gap: 12px;">
      <button type="submit" class="btn btn-primary" style="padding: 10px 24px;">Simpan Menu</button>
      <a href="/menu" class="btn btn-outline" style="padding: 10px 20px;">Batal</a>
    </div>
  </form>
</div>
{% endblock %}
