<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block judul %}KasirWarung{% endblock %}</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #212529;
      --border: #dee2e6;
      --primary: #0d6efd;
      --success-bg: #d1e7dd;
      --success-text: #0f5132;
      --error-bg: #f8d7da;
      --error-text: #842029;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
    }
    header {
      background-color: #212529;
      color: #fff;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h2 { margin: 0; font-size: 20px; font-weight: 600; }
    nav a {
      color: #ced4da;
      text-decoration: none;
      margin-left: 18px;
      font-weight: 500;
    }
    nav a:hover, nav a.active { color: #fff; text-decoration: underline; }
    .container {
      max-width: 1000px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .pesan-flash {
      padding: 12px 16px;
      margin-bottom: 20px;
      border-radius: 6px;
      font-size: 15px;
    }
    .pesan-sukses {
      background-color: var(--success-bg);
      color: var(--success-text);
      border: 1px solid #badbcc;
    }
    .pesan-galat {
      background-color: var(--error-bg);
      color: var(--error-text);
      border: 1px solid #f5c2c7;
    }
  </style>
</head>
<body>
  <header>
    <h2>KasirWarung</h2>
    <nav>
      <a href="{{ url_for('daftar_menu') }}">Kelola Menu</a>
    </nav>
  </header>

  <main class="container">
    {% for pesan in get_flashed_messages() %}
      <div class="pesan-flash pesan-sukses">{{ pesan }}</div>
    {% endfor %}

    {% block isi %}{% endblock %}
  </main>
</body>
</html>
